name: Crea Omnia Print by neXus (Windows e macOS)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-15
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Versione = numero della build
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm run ${{ matrix.script }}
      - name: Crea l'aggiornamento leggero
        if: matrix.os == 'windows-latest'
        run: npm run make-update
      - uses: actions/upload-artifact@v4
        with:
          name: omnia-print-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
      - name: Pubblica nella sezione Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Omnia Print by neXus v1.0.${{ github.run_number }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist-update/update-*.asar
            dist-update/update.json
